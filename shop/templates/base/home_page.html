<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coffee Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; background: #f7f3ed; margin: 0; }
        header { background: #6f4e37; color: #fff; padding: 1.5rem 0; text-align: center; }
        nav { background: #8d6748; padding: 0.5rem 0; text-align: center; }
        nav a { color: #fff; margin: 0 1rem; text-decoration: none; font-weight: bold; }
        .container { max-width: 900px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        h1, h2 { margin-top: 0; }
        .menu { display: flex; flex-wrap: wrap; gap: 2rem; }
        .menu-item { flex: 1 1 250px; background: #f0e6d6; padding: 1rem; border-radius: 6px; text-align: center; }
        .menu-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; }
        footer { text-align: center; padding: 1rem 0; background: #6f4e37; color: #fff; margin-top: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Coffee Shop</h1>
        <p>Your daily dose of fresh coffee and pastries</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <h2>Our Menu</h2>
        <div class="menu">
            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=200&q=80" alt="Espresso">
                <h3>Espresso</h3>
                <p>Rich and bold espresso shot.</p>
                <p><strong>$2.50</strong></p>
            </div>
            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=200&q=80" alt="Cappuccino">
                <h3>Cappuccino</h3>
                <p>Creamy milk foam with espresso.</p>
                <p><strong>$3.00</strong></p>
            </div>
            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=200&q=80" alt="Croissant">
                <h3>Croissant</h3>
                <p>Freshly baked buttery croissant.</p>
                <p><strong>$2.00</strong></p>
            </div>
        </div>
    </div>
    <footer>
        &copy; 2024 Coffee Shop. All rights reserved.
    </footer>
</body>
</html>
